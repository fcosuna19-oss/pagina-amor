<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>La prueba ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="preguntas">

    <div class="corazones"></div>

    <main class="quiz-container">

        <p id="contador">Pregunta 1 de 10</p>

        <div class="barra">
            <div id="progreso"></div>
        </div>

        <div id="quiz"></div>

        <button
            id="siguiente"
            class="btn-romantico"
            onclick="siguientePregunta()">
            Siguiente ❤️
        </button>

        <div id="resultado"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
