<!DOCTYPE html>
<html lang="es">

</head>

<body class="inicio">

            ¿Eres el<br>
            <span>amor de mi vida?</span>

        <div class="botones-inicio">

            <button
                class="btn-romantico"
                onclick="respuestaSip()">
                Sip ❤️
            </button>

            <button
                class="btn-romantico"
                onclick="irAPrueba()">
                Ponme a prueba 💕
            </button>

        </div>

        <div id="mensaje"></div>

    </main>

    <script src="script.js"></script>

</body>
</html>
